name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the five test suites (standard library only)
        run: |
          set -e
          for t in tests/check_*.py; do
            echo "== $t"
            python "$t"
          done

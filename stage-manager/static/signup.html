<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Guitar Hero Live — Sign Up</title>
<link rel="stylesheet" href="/static/brand.css">
<style>
  body { min-height: 100vh; padding: 0 16px calc(230px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
  .fretbar.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; }
  header { padding: calc(30px + env(safe-area-inset-top)) 0 6px; }
  header .lockup { font-size: clamp(22px, 7vw, 30px); justify-content: center; }
  header h1 { font-size: clamp(54px, 17vw, 84px); margin: 22px 0 0; text-align: center; }
  header p { color: var(--muted); margin: 10px 0 0; font-size: 14px; text-align: center; }
  label { display: block; margin: 26px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .18em; font-weight: 700; }
  label small { color: var(--muted); font-weight: 400; letter-spacing: .05em; text-transform: none; font-size: 12px; }
  input[type=text] {
    width: 100%; padding: 14px 16px; font-size: 18px; color: var(--bone); background: var(--ink-2);
    border: 1px solid var(--line); border-radius: 0; outline: none; font-family: var(--mono);
  }
  input[type=text]:focus { border-color: var(--bone); }
  .songs { display: grid; gap: 8px; }
  .difficulty { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .difficulty button { padding: 12px 3px; border: 1px solid var(--line); background: var(--ink-2); color: var(--bone); font: 700 13px var(--mono); cursor: pointer; }
  .difficulty button[aria-pressed=true] { color: var(--ink); background: var(--fret-yellow); border-color: var(--fret-yellow); }
  .difficulty button:disabled { opacity: .3; cursor: default; }
  .song {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left;
    padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--ink-2);
    color: var(--bone); cursor: pointer; border-radius: 0;
  }
  .song:nth-child(5n+1) { --c: var(--fret-green); } .song:nth-child(5n+2) { --c: var(--fret-red); }
  .song:nth-child(5n+3) { --c: var(--fret-yellow); } .song:nth-child(5n+4) { --c: var(--fret-blue); }
  .song:nth-child(5n+5) { --c: var(--fret-orange); }
  .song img, .song .ph { width: 56px; height: 56px; object-fit: cover; background: #222; filter: grayscale(.35) contrast(1.1); }
  .song .t { font-family: var(--head); font-size: 24px; letter-spacing: .02em; line-height: 1; }
  .song .a { color: var(--muted); font-size: 13px; }
  .song .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
  .song[aria-pressed=true] { background: color-mix(in srgb, var(--c) 18%, var(--ink-2)); border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset, 0 0 22px color-mix(in srgb, var(--c) 35%, transparent); }
  .song[aria-pressed=true] img { filter: none; }
  .song[aria-pressed=true] .tag { color: var(--c); }
  .song:disabled { opacity: .3; cursor: not-allowed; border-left-color: #444; }
  .song:disabled .t { text-decoration: line-through; }
  .song.encore:disabled { opacity: .85; border-left-color: var(--fret-yellow); background: linear-gradient(90deg, rgba(255,214,10,.12), var(--ink-2) 60%); }
  .song.encore:disabled .t { text-decoration: none; }
  .song.encore .a, .song.encore .tag { color: var(--fret-yellow); }
  .song.encore .ph { display: grid; place-items: center; background: rgba(255,214,10,.14); }
  .song.encore .ph::after { content: "?"; font-family: var(--head); font-size: 34px; color: var(--fret-yellow); }
  .done .pos small { color: var(--muted); font-size: 13px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 4;
    background: linear-gradient(180deg, rgba(11,11,11,0), var(--ink) 35%);
  }
  .go {
    width: 100%; padding: 14px 16px 12px; border: 0; cursor: pointer; color: #04140a; background: var(--fret-green);
    font-family: var(--head); font-size: 30px; letter-spacing: .05em; display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 0 28px rgba(43,217,107,.35);
  }
  .go .gem { font-size: 26px; }
  .go:disabled { background: #2a2a2a; color: #666; box-shadow: none; }
  .go.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); box-shadow: none; font-size: 22px; }
  .err { color: #ff8a8a; min-height: 1.3em; margin: 0 0 8px; text-align: center; font-size: 14px; }
  .done { text-align: center; padding-top: 18px; }
  .done .big { font-size: clamp(64px, 20vw, 96px); margin: 8px 0 6px; }
  .done .pos { font-size: 16px; line-height: 1.5; }
  .done .song-line { margin: 22px auto; padding: 12px; border: 1px solid var(--line); border-left: 4px solid var(--fret-green); text-align: left; background: var(--ink-2); }
  .done .song-line b { font-family: var(--head); font-weight: 400; font-size: 28px; display: block; line-height: 1; }
  .done .song-line small { color: var(--muted); font-size: 13px; }
  .follow { display: grid; gap: 10px; margin: 14px 0 10px; }
  .follow a {
    display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 14px 12px;
    color: var(--ink); background: var(--bone); text-decoration: none; font-family: var(--head); font-size: 24px; letter-spacing: .04em;
  }
  .follow .sp { background: #1db954; color: #04130a; }
  .follow svg { width: 22px; height: 22px; }
  .hint { color: var(--muted); font-size: 13px; }
  .go { position: relative; overflow: hidden; }
  @media (prefers-reduced-motion: no-preference) {
    header .lockup { animation: drop .8s cubic-bezier(.2,.8,.2,1) both; }
    header h1 .ch, .done .big .ch { display: inline-block; animation: slam .6s cubic-bezier(.2,.9,.25,1.15) both; animation-delay: calc(var(--i) * 32ms + 150ms); }
    header p { animation: rise .7s .6s cubic-bezier(.2,.8,.2,1) both; }
    .form-in > label, .form-in > input { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.7s + var(--i, 0) * 70ms); }
    .intro .song { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(1s + var(--i) * 45ms); }
    .song { transition: transform .15s ease, background .2s ease, box-shadow .25s ease; }
    .song:active:not(:disabled) { transform: scale(.98); }
    .song[aria-pressed=true] { animation: pick .4s cubic-bezier(.2,.9,.3,1.4); }
    .go:not(:disabled)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-100%); animation: shine 2.6s 0.4s ease-in-out infinite; }
    .go:not(:disabled) .gem { animation: beat 1.3s ease-in-out infinite; }
    .done .eyebrow { animation: rise .5s both; }
    .done .pos { animation: rise .6s .5s cubic-bezier(.2,.8,.2,1) both; }
    .done .song-line { animation: rise .6s .65s cubic-bezier(.2,.8,.2,1) both; }
    .done .hint { animation: fadeIn .6s .85s both; }
    .follow a { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.95s + var(--i, 0) * 120ms); }
    .err:not(:empty) { animation: shake .4s; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes drop { from { opacity: 0; transform: translateY(-14px); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes slam { from { opacity: 0; transform: translateY(.18em) scale(1.35); filter: blur(2px); } 60% { opacity: 1; } }
  @keyframes pick { 40% { transform: scale(1.03); } }
  @keyframes shine { 60%, 100% { transform: translateX(100%); } }
  @keyframes beat { 50% { transform: scale(1.15); } }
  @keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
  .w { display: inline-block; white-space: nowrap; }  /* a word of per-letter spans never splits across lines */
  .closed { text-align: center; color: var(--muted); padding: 40px 0; font-size: 16px; line-height: 1.6; }
  /* "you're on deck" / "you're up": impossible to miss, even glancing at the phone in a dark room */
  .alert { margin: 6px 0 4px; padding: 16px 14px 13px; font-family: var(--head); font-size: 30px; letter-spacing: .04em; line-height: 1; text-align: center; }
  .alert small { display: block; font-family: var(--mono); font-size: 13px; letter-spacing: .06em; margin-top: 7px; text-transform: none; }
  .alert.deck { background: var(--fret-yellow); color: var(--ink); }
  .alert.up { background: var(--fret-green); color: #04140a; }
  .alert.lost { background: var(--ink-2); color: var(--bone); border: 1px solid var(--fret-red); animation: none; }
  @media (prefers-reduced-motion: no-preference) { .alert { animation: flash 1.1s ease-in-out infinite; } }
  @keyframes flash { 50% { filter: brightness(1.25); transform: scale(1.015); } }
  .notify { width: 100%; margin: 4px 0 14px; padding: 12px; border: 1px solid var(--line); background: var(--ink-2); color: var(--bone);
            font: 700 13px var(--mono); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .notify.on { border-color: var(--fret-green); color: var(--fret-green); cursor: default; }
  .card-wrap { margin: 18px 0 6px; }
  .lefty { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; text-transform: none; letter-spacing: .02em; font-size: 14px; font-weight: 400; color: var(--bone); }
  .lefty input { width: 20px; height: 20px; accent-color: var(--fret-green); }
  .lefty span { flex: 1; line-height: 1.35; }
  .lefty small { color: var(--muted); font-size: 12px; }
  .card-wrap img { width: 100%; display: block; border: 1px solid var(--line); }
  .card-actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
  .card-btn { padding: 13px 14px 11px; border: 0; cursor: pointer; background: var(--fret-yellow); color: var(--ink); font-family: var(--head); font-size: 24px; letter-spacing: .04em; }
  .card-btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); font-size: 20px; }
</style>
</head>
<body class="grain">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter>
</svg>
<div class="fretbar top"><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <div class="lockup"><img class="logo-w" src="/static/jr-logo.png" alt="Jordan Rein"><span class="bar"></span><span class="gh rough">Guitar Hero<br><span class="live">Live</span></span></div>
    <h1 class="head rough spray" id="h1">Play with<br>the band.</h1>
    <p id="tag">Pick a song. When your name hits the big screen, the guitar is yours.</p>
  </header>
  <main id="main"></main>
</div>
<div class="bar" id="bar" hidden><div class="wrap"><label class="lefty" id="lefty-row" hidden><input type="checkbox" id="lefty"><span>I play left-handed <small>· the game flips for your song</small></span></label><div id="difficulty-choice" hidden><label style="margin:0 0 7px">Difficulty <small id="difficulty-note"></small></label><div class="difficulty" id="difficulty" style="margin-bottom:10px"></div></div><p class="err" id="err"></p><button class="go" id="go" disabled><span class="gem g"></span>Get in line</button></div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let device = store.get("ghl-device");
if (!device) { device = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("ghl-device", device); }

const setHTML = (el, html) => { if (el._h !== html) { el.innerHTML = html; el._h = html; } };
// one span per letter (for the slam-in), grouped per word so a line can only break between words
const letters = (s) => { let i = 0; return String(s ?? "").split(" ").map((w) => `<span class="w">${Array.from(w).map((c) => `<span class="ch" style="--i:${i++}">${esc(c)}</span>`).join("")}</span>`).join(" "); };
$("h1").innerHTML = letters("Play with") + "<br>" + letters("the band.");
let S = null, picked = null, difficulty = "easy", mine = store.get("ghl-mine"), busy = false;
const LEVELS = ["easy", "medium", "hard", "expert"];
const IG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>`;
const SP = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.62.62 0 0 1-.86.2c-2.35-1.43-5.3-1.76-8.79-.96a.62.62 0 1 1-.28-1.21c3.81-.87 7.08-.5 9.72 1.11.3.18.39.57.21.86zm1.23-2.73a.78.78 0 0 1-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.17a.78.78 0 0 1-.45-1.49c3.63-1.1 8.15-.57 11.23 1.33.37.22.49.7.26 1.07zm.1-2.85C14.7 8.9 9.38 8.73 6.3 9.66a.94.94 0 1 1-.54-1.8c3.53-1.07 9.41-.86 13.12 1.34a.94.94 0 0 1-.96 1.62z"/></svg>`;

function followLinks() {
  const l = S.links;
  return `<div class="follow">
    ${l.instagram ? `<a class="ig" style="--i:0" href="https://instagram.com/${esc(l.instagram)}" target="_blank" rel="noopener">${IG} Follow @${esc(l.instagram)}</a>` : ""}
    ${l.spotify ? `<a class="sp" style="--i:1" href="${esc(l.spotify)}" target="_blank" rel="noopener">${SP} Follow Jordan Rein on Spotify</a>` : ""}
  </div>`;
}

function renderForm() {
  $("bar").hidden = !S.signupsOpen;
  if (!S.signupsOpen) {
    setHTML($("main"), `<div class="closed">Sign-ups are closed right now.<br>Thanks for rocking with us!</div>${followLinks()}`);
    return;
  }
  if (!$("songs")) {
    $("main")._h = null;
    $("main").innerHTML = `<div class="form-in">
      <label for="name" style="--i:0">Your name <small>(shows up on the big screen)</small></label>
      <input type="text" id="name" style="--i:1" maxlength="24" autocomplete="given-name" placeholder="e.g. Sam">
      <label for="ig" style="--i:2">Instagram <small>(optional, for a shout-out)</small></label>
      <input type="text" id="ig" style="--i:3" maxlength="30" autocapitalize="off" autocorrect="off" placeholder="@yourhandle">
      <label style="--i:4">Pick your song <small>(one player per song)</small></label>
      <div class="songs intro" id="songs"></div></div>`;
    setTimeout(() => $("songs") && $("songs").classList.remove("intro"), 2400);
    $("name").addEventListener("input", sync);
    $("name").value = store.get("ghl-name") || "";
  }
  const open = S.songs.filter((s) => !s.taken);
  if (picked && !open.find((s) => s.id === picked)) { picked = null; $("err").textContent = "Someone just grabbed that song. Pick another!"; }
  setHTML($("songs"), (open.length ? "" : `<div class="hint">Every song is taken tonight. Catch us next time!</div>`) +
    [...open, ...S.songs.filter((s) => s.taken && !s.encore), ...S.songs.filter((s) => s.encore)].map((s, i) => `
    <button type="button" class="song${s.encore ? " encore" : ""}" style="--i:${i}" data-id="${s.id}" aria-pressed="${s.id === picked}" ${s.taken ? "disabled" : ""}>
      ${s.art ? `<img src="/art/${s.id}" alt="" loading="lazy">` : `<span class="ph"></span>`}
      <span><span class="t">${esc(s.name)}</span><br><span class="a">${s.encore ? "Saved for tonight's top scorer" : esc(s.artist) + (s.difficulties?.length === 1 ? " · " + esc(s.difficulties[0][0].toUpperCase() + s.difficulties[0].slice(1)) + " only" : "")}</span></span>
      <span class="tag">${s.encore ? "Encore" : s.taken ? "Taken" : s.id === picked ? "Yours" : ""}</span>
    </button>`).join(""));
  document.querySelectorAll(".song:not(:disabled)").forEach((b) => b.onclick = () => { if (picked !== b.dataset.id) difficulty = "easy"; picked = b.dataset.id; $("err").textContent = ""; renderForm(); });
  const song = S.songs.find((s) => s.id === picked);
  const supported = song ? (song.difficulties?.length ? song.difficulties : LEVELS) : [];
  if (song && !supported.includes(difficulty)) difficulty = supported.find((d) => LEVELS.indexOf(d) >= LEVELS.indexOf(difficulty)) || supported[supported.length - 1];
  $("difficulty-choice").hidden = !song;
  $("lefty-row").hidden = !song || !S.leftyOption;
  $("difficulty-note").textContent = song ? (supported.length === 1 ? "This chart supports " + difficulty[0].toUpperCase() + difficulty.slice(1) + " only" : "Choose your level before joining") : "Choose a song first";
  setHTML($("difficulty"), LEVELS.map((d) => `<button type="button" data-difficulty="${d}" aria-pressed="${Boolean(song && d === difficulty)}" ${supported.includes(d) ? "" : "disabled"}>${d[0].toUpperCase() + d.slice(1)}</button>`).join(""));
  document.querySelectorAll(".difficulty button:not(:disabled)").forEach((b) => b.onclick = () => { difficulty = b.dataset.difficulty; renderForm(); });
  sync();
}

function sync() { $("go").disabled = busy || !picked || !$("name")?.value.trim(); }

$("go").onclick = async () => {
  busy = true; sync(); $("err").textContent = "";
  const name = $("name").value.trim();
  store.set("ghl-name", name);
  try {
    const r = await (await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, ig: $("ig").value, songId: picked, device, difficulty, lefty: !!S.leftyOption && $("lefty").checked }) })).json();
    if (r.ok) { mine = { id: r.id, name, song: r.song, artist: r.artist, difficulty: r.difficulty }; store.set("ghl-mine", mine); picked = null; }
    else $("err").textContent = r.error || "Something went wrong. Try again.";
  } catch (e) { $("err").textContent = "Couldn't reach the stage. Check your signal and try again."; }
  busy = false; sync(); await refresh();
};

let phase = null, alertsOn = false, audio = null, wakeLock = null, cardFor = null;
let fails = 0;  // refreshes in a row that couldn't reach the stage (bad signal, or the stage's public link changed)
function renderMine() {
  $("bar").hidden = true;
  const matches = (e) => e.id && mine.id ? e.id === mine.id :
    e.name.trim().replace(/\s+/g, " ") === mine.name.trim().replace(/\s+/g, " ") && e.song === mine.song;
  const qi = S.queue.findIndex(matches);
  const onStage = S.current && matches(S.current);
  const scored = S.leaderboard.find(matches);
  const finished = !onStage && qi < 0;
  const ahead = qi >= 0 ? qi + (S.current ? 1 : 0) : -1;
  // on deck: next to be called (or the host has picked them on the stage screen)
  const deck = qi >= 0 && (ahead === 0 || (qi === 0 && S.current) || (!S.current && S.selected === qi));
  const now = onStage ? "up" : deck ? "deck" : qi >= 0 ? "wait" : "done";
  if (now !== phase) { if (phase && (now === "deck" || now === "up")) ping(now); phase = now; poll(now === "deck" || now === "up" ? 2000 : 4000); }
  let head, sub, alert = "";
  if (onStage) { head = "You're up!"; sub = "The band is calling you up. Watch the big screen!"; alert = `<div class="alert up">Head to the stage now<small>Grab the guitar, your song is ready</small></div>`; }
  else if (qi >= 0) {
    head = "You're in!"; sub = "Stay tuned, you'll be called up shortly." + (ahead > 0 ? `<br><small>${ahead} ${ahead === 1 ? "player" : "players"} ahead of you</small>` : "");
    if (deck) alert = `<div class="alert deck">You're on deck<small>Make your way to the side of the stage</small></div>`;
  } else if (scored) { head = "Legend."; sub = `You scored ${scored.score.toLocaleString("en-US")} points. Rank #${S.leaderboard.indexOf(scored) + 1} tonight.`; }
  else { head = "Thanks for rocking!"; sub = "Your turn is wrapped. Stick around for the rest of the set."; }
  const level = (onStage && S.current.difficulty) || (qi >= 0 && S.queue[qi].difficulty) || mine.difficulty;
  const notify = qi >= 0 && !onStage ? `<button class="notify${alertsOn ? " on" : ""}" id="notify">${alertsOn ? "Alerts on · keep this page open" : "Alert me when I'm next"}</button>` : "";
  const card = finished ? `<div class="card-wrap" id="cardwrap"></div>` : "";
  if (fails >= 4 && !finished) alert = `<div class="alert lost">Can't reach the stage<small>You keep your place in line. Watch the big screen for your name.</small></div>`;
  setHTML($("main"), `<div class="done">
    ${alert}
    <div class="eyebrow">${esc(mine.name)}</div>
    <div class="big head rough spray">${letters(head)}</div>
    <div class="pos">${sub}</div>
    <div class="song-line"><small>YOUR SONG</small><b>${esc(mine.song)}</b><small>${esc(mine.artist)}${level ? " · " + esc(level) : ""}</small></div>
    ${notify}${card}
    <p class="hint">${finished ? "Show the band some love:" : "While you wait, show the band some love:"}</p>
    ${followLinks()}
  </div>`);
  if ($("notify") && !alertsOn) $("notify").onclick = armAlerts;
  document.title = now === "up" ? "▶ YOU'RE UP — Guitar Hero Live" : now === "deck" ? "▶ ON DECK — Guitar Hero Live" : "Guitar Hero Live — Sign Up";
  if (finished) showCard(scored);
}

// ---- alerts: a tap arms sound (browsers only allow audio after a tap) and keeps the screen awake while waiting
async function armAlerts() {
  alertsOn = true;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); await audio.resume(); beep(0.01); } catch (e) { audio = null; }
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) { wakeLock = null; }
  $("main")._h = null; renderMine();
}
document.addEventListener("visibilitychange", async () => {
  if (alertsOn && document.visibilityState === "visible" && (!wakeLock || wakeLock.released)) {  // (a hidden page loses its lock)
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  }
});
function beep(vol = 0.25) {
  if (!audio) return;
  const t = audio.currentTime;
  [[659, 0], [988, 0.14], [1319, 0.28]].forEach(([f, d]) => {  // three rising notes
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(vol, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
    o.start(t + d); o.stop(t + d + 0.25);
  });
}
function ping(kind) {
  try { navigator.vibrate?.(kind === "up" ? [300, 120, 300, 120, 300] : [220, 100, 220]); } catch (e) {}
  beep();
}
let pollTimer = null;
function poll(ms) {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!busy && document.activeElement?.tagName !== "INPUT") refresh(); }, ms);
}

// ---- result card: made on the phone, saved or shared straight to a story / camera roll
function showCard(scored) {
  const key = mine.id + "|" + (scored ? scored.score : "x");
  if (cardFor === key && $("cardwrap")?.firstChild) return;
  cardFor = key;
  drawCard(scored).then((blob) => {
    const wrap = $("cardwrap"); if (!wrap || !blob) return;
    const url = URL.createObjectURL(blob);
    const file = new File([blob], "guitar-hero-live.png", { type: "image/png" });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    wrap.innerHTML = `<img alt="Your Guitar Hero Live result card" src="${url}"><div class="card-actions">
      ${canShare ? `<button class="card-btn" id="share">Share your card</button>` : ""}
      <a class="card-btn${canShare ? " ghost" : ""}" id="save" href="${url}" download="guitar-hero-live.png" style="text-align:center;text-decoration:none">Save image</a></div>`;
    if (canShare) $("share").onclick = () => navigator.share({ files: [file], text: `I played with the band at ${S.show}! @${S.links.instagram || "jordanrein_"}` }).catch(() => {});
  });
}
async function drawCard(scored) {
  try { await document.fonts.load('80px "Bebas Neue"'); await document.fonts.load('700 30px "Space Mono"'); await document.fonts.load('30px "Space Mono"'); } catch (e) {}
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const FR = ["#2bd96b", "#ff3b3b", "#ffd60a", "#1a93fe", "#ff8a1f"];
  x.fillStyle = "#0b0b0b"; x.fillRect(0, 0, W, H);
  // stage light from above, and the highway rushing toward you at the bottom
  let g = x.createRadialGradient(W / 2, -120, 40, W / 2, -120, 1100); g.addColorStop(0, "rgba(244,239,230,.20)"); g.addColorStop(1, "rgba(244,239,230,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const vy = 860, by = H, top = 120, bot = 560;
  x.save(); x.beginPath(); x.moveTo(W / 2 - top, vy); x.lineTo(W / 2 + top, vy); x.lineTo(W / 2 + bot, by); x.lineTo(W / 2 - bot, by); x.closePath(); x.clip();
  g = x.createLinearGradient(0, vy, 0, by); g.addColorStop(0, "#0b0b0b"); g.addColorStop(1, "#1c1c20"); x.fillStyle = g; x.fillRect(0, vy, W, by - vy);
  x.strokeStyle = "rgba(244,239,230,.14)"; x.lineWidth = 2;
  for (let i = 1; i < 5; i++) { const k = i / 5; x.beginPath(); x.moveTo(W / 2 - top + 2 * top * k, vy); x.lineTo(W / 2 - bot + 2 * bot * k, by); x.stroke(); }
  for (let i = 0; i < 6; i++) { const yy = vy + (by - vy) * Math.pow(i / 6, 1.7); x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); }
  x.restore();
  x.strokeStyle = "rgba(244,239,230,.75)"; x.lineWidth = 5;
  [[-1], [1]].forEach(([s]) => { x.beginPath(); x.moveTo(W / 2 + s * top, vy); x.lineTo(W / 2 + s * bot, by); x.stroke(); });
  FR.forEach((col, i) => { x.fillStyle = col; x.fillRect(i * W / 5, 0, W / 5 + 1, 14); });
  // lockup: the Jordan Rein mark (recoloured bone), a rule, GUITAR HERO + LIVE
  const logo = await new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = "/static/jr-logo.png"; });
  if (logo) {
    const lc = document.createElement("canvas"); lc.width = logo.width; lc.height = logo.height; const lx = lc.getContext("2d");
    lx.drawImage(logo, 0, 0); const d = lx.getImageData(0, 0, lc.width, lc.height);
    for (let i = 0; i < d.data.length; i += 4) { d.data[i] = 244; d.data[i + 1] = 239; d.data[i + 2] = 230; }
    lx.putImageData(d, 0, 0); x.drawImage(lc, 150, 92, 290, 290 * logo.height / logo.width);
  }
  x.fillStyle = "rgba(244,239,230,.35)"; x.fillRect(490, 100, 3, 170);
  x.fillStyle = "#f4efe6"; x.font = '120px "Bebas Neue"'; x.textBaseline = "alphabetic"; x.fillText("GUITAR HERO", 530, 200);
  x.save(); x.translate(530, 220); x.rotate(-0.05); x.fillStyle = "#ee3a3a"; x.fillRect(0, 0, 150, 88); x.fillStyle = "#0b0b0b"; x.font = '96px "Bebas Neue"'; x.fillText("LIVE", 18, 80); x.restore();
  // the player
  x.textAlign = "center";
  x.fillStyle = "#ffd60a"; x.font = '700 30px "Space Mono"'; x.fillText("I PLAYED WITH THE BAND", W / 2, 420);
  let size = 190; x.font = `${size}px "Bebas Neue"`; const name = mine.name.toUpperCase();
  while (x.measureText(name).width > W - 140 && size > 70) { size -= 6; x.font = `${size}px "Bebas Neue"`; }
  const nameY = 430 + size * 0.9;
  x.fillStyle = "#f4efe6"; x.shadowColor = "rgba(0,0,0,.6)"; x.shadowBlur = 24; x.fillText(name, W / 2, nameY); x.shadowBlur = 0;
  x.fillStyle = "#9a958d"; x.font = '34px "Space Mono"'; x.fillText(`${mine.song} · ${mine.artist}`.slice(0, 44), W / 2, nameY + 68);
  let y = Math.max(nameY + 230, 790);  // the score's baseline: always clear of the song line
  if (scored) {
    x.fillStyle = "#f4efe6"; x.font = '150px "Bebas Neue"'; x.fillText(scored.score.toLocaleString("en-US"), W / 2, y);
    x.fillStyle = "#9a958d"; x.font = '700 26px "Space Mono"'; x.fillText("POINTS", W / 2, y + 44);
    const n = Math.max(0, Math.min(7, scored.stars || 0));
    for (let i = 0; i < n; i++) { const sx = W / 2 + (i - (n - 1) / 2) * 62, sy = y + 104; x.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 11 : 26, a = -Math.PI / 2 + k * Math.PI / 5; x.lineTo(sx + r * Math.cos(a), sy + r * Math.sin(a)); } x.closePath(); x.fillStyle = "#ffc21a"; x.fill(); }
    const rank = S.leaderboard.indexOf(scored) + 1;
    x.fillStyle = "#ffd60a"; x.font = '700 30px "Space Mono"'; x.fillText(`#${rank} OF ${S.leaderboard.length} TONIGHT`, W / 2, y + (n ? 182 : 120));
  } else {
    x.fillStyle = "#f4efe6"; x.font = '110px "Bebas Neue"'; x.fillText("ROCK STAR", W / 2, y - 20);
  }
  // footer
  x.fillStyle = "rgba(11,11,11,.72)"; x.fillRect(0, H - 120, W, 120);
  x.fillStyle = "#f4efe6"; x.font = '700 32px "Space Mono"'; x.fillText("@" + (S.links.instagram || "jordanrein_"), W / 2, H - 66);
  x.fillStyle = "#9a958d"; x.font = '26px "Space Mono"';
  x.fillText(`${S.show} · ${new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}`, W / 2, H - 28);
  return new Promise((ok) => c.toBlob(ok, "image/png"));
}

async function refresh() {
  try { S = await (await fetch("/api/public", { cache: "no-store" })).json(); fails = 0; }
  catch (e) { if (++fails === 4 && mine && S) renderMine(); return; }
  // A removed/skipped signup or a reset frees this phone to join again. Completed
  // turns, including those still needing a score, retain their thank-you screen.
  if (mine && Array.isArray(S.completedIds) &&
      !S.queue.some((e) => e.id === mine.id) && S.current?.id !== mine.id &&
      !S.completedIds.includes(mine.id)) {
    mine = null; store.del("ghl-mine");
  }
  if (mine) renderMine(); else renderForm();
}
// The fixed bottom bar grows with the difficulty and lefty rows: keep the page's bottom padding a little taller than
// the bar, so the last songs in the list can always be scrolled into view above it.
if (window.ResizeObserver) new ResizeObserver(() => {
  const bar = $("bar");
  document.body.style.paddingBottom = bar.hidden ? "" : `calc(${bar.offsetHeight + 24}px + env(safe-area-inset-bottom))`;
}).observe($("bar"));
refresh();
poll(4000);
</script>
